<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Vitalis</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="index.html" class="nav-logo">Home</a>
        <ul class="nav-links" class="active">
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main class="contact-page">
      <form id="contact-form" novalidate>
        <h2>Contact Us</h2>

        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            data-testid="test-contact-name"
            required
          />
          <small
            id="error-name"
            class="error"
            data-testid="test-contact-error-name"
          ></small>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            data-testid="test-contact-email"
            required
          />
          <small
            id="error-email"
            class="error"
            data-testid="test-contact-error-email"
          ></small>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input
            type="text"
            id="subject"
            data-testid="test-contact-subject"
            required
          />
          <small
            id="error-subject"
            class="error"
            data-testid="test-contact-error-subject"
          ></small>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            data-testid="test-contact-message"
            required
          ></textarea>
          <small
            id="error-message"
            class="error"
            data-testid="test-contact-error-message"
          ></small>
        </div>

        <button type="submit" data-testid="test-contact-submit">Submit</button>
        <p
          id="success"
          class="success"
          data-testid="test-contact-success"
          hidden
        >
          ✅ Thank you! Your message has been successfully sent.
        </p>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
